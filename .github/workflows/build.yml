name: Build Noor3D Android APK from ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Noor3D-AI-Studio.zip'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Find and extract project ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f \( -iname 'Noor3D-AI-Studio.zip' -o -iname 'Noor3D-Android-Prototype.zip' \) | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then echo 'Project ZIP not found in repository root.'; find . -maxdepth 3 -type f; exit 1; fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
          if [ -z "$SETTINGS" ]; then echo 'Gradle settings file was not found inside ZIP.'; exit 1; fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f | head -100
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor3D-AI-Studio-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
