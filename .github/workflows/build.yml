name: Build Noor3D Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 4 -type f -iname 'Noor3D-Android-Prototype.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Noor3D-Android-Prototype.zip not found."
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | head -n 200

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          GRADLE_FILE="$(find extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find extracted -maxdepth 6 -type f | head -n 300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Check project files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          ls -la

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ] && \
             [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: Gradle build file not found."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor3D-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
